# Alternative to native `claude plugin install`: the same plugins through apm (flat skills, commands and hooks).
# Use ONE path per host, not both. Install with:  apm install -g  using this file as ~/.apm/apm.yml
# Toolkit agents/ are plain markdown with no package manifest: apm cannot install them (toolkit bootstrap does).
# caveman-stats (hook-only plugin) and agytoggle are installed natively.
# Not resolvable by apm, installed natively: reflect (agents-in-a-box), mcporter, graphify, claude-peers.
# egm (google/elephant-goldfish-model) is left out: apm leaves its resources/ behind, which its skills read at run time.
# ponytail is left out: its hooks use process.env.CLAUDE_PLUGIN_ROOT, which apm cannot relocate.
name: ainb-fleet-plugins
version: 0.1.0
targets: [claude, codex]
dependencies:
  apm:
    - stevengonsalvez/ainb-toolkit/plugins/godmode
    - stevengonsalvez/ainb-toolkit/plugins/orchestrate
