# Deliberately invalid: the AiResource has no spec.owner and its name carries
# a space, which the field-format policy rejects.
# The API carries a definition but an empty remotes list, which only the
# mcp-server spec type schema rejects. The last AiResource is base-valid but
# its disciplines is not an array, which only the skill spec type schema rejects.
# The next carries a mistyped spec.type, which must not fall through to the
# base schema, and the last uses a spec.type that is an Object.prototype
# property name, which must be reported as unknown rather than crash.
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: broken skill
  description: A skill entity that must never validate
spec:
  type: skill
  lifecycle: experimental
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: broken-mcp
spec:
  type: mcp-server
  lifecycle: experimental
  owner: user:nobody
  remotes: []
  definition: declared in apm.yml
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: skill-schema-probe
spec:
  type: skill
  lifecycle: experimental
  owner: user:nobody
  disciplines: not-an-array
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: mistyped-spec-type
spec:
  type: skil
  lifecycle: experimental
  owner: user:nobody
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: prototype-spec-type
spec:
  type: constructor
  lifecycle: experimental
  owner: user:nobody
