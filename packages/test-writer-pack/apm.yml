name: test-writer-pack
version: 0.1.0
description: Test authoring and repair. Ships one testing skill and the matching agent to GitHub Copilot and Claude Code.
author: stevengonsalvez
license: MIT
repository: https://github.com/stevengonsalvez/ainb-toolkit
keywords: [testing, qe, test-authoring]

# Skills and agents only: nothing here compiles into the harness context files,
# so this is a skill package rather than a hybrid one. APM accepts
# instructions, skill, hybrid and prompts; there is no separate agent type.
type: skill

# Pinned rather than auto-detected, so the pack deploys the same tree on every
# machine. Consumers on another harness opt in with `apm install -t <name>`.
targets:
  - copilot
  - claude

dependencies:
  apm: []
  mcp: []

# How this pack is evaluated, declared once. The measured result is not stored
# here: `wololo-evals-cli run --config apm.yml` writes eval-gate-report.json
# beside this file, and that report is the only place a score lives. `asset`
# is omitted because the pack has exactly one skill. The values mirror the live
# run that produced the committed report (matrix-candidate.toml in wololo-evals:
# claude engine, claude-sonnet-5, 12.0 USD cap, 0.7 pass threshold, no
# tolerated regression).
eval:
  benchmark: qe-skill
  engine: claude
  model: claude-sonnet-5
  max_cost_usd: 12.0
  thresholds: { pass: 0.7, max_regression: 0.0 }
