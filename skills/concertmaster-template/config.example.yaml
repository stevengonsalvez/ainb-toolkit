# concertmaster config: everything that varies per project.
# Copy to config.yaml (next to SKILL.md) and fill every value. No secrets go
# here: tokens live in files under ~/.secrets (or a vault) and this file only
# names them. Keys marked [script] are read by scripts/lib.sh; the rest are
# read by the concertmaster session from SKILL.md and references/lanes.md.
# Lookup order for scripts: $CM_CONFIG, <skill>/config.yaml,
# $CM_HOME/config.yaml. An env var (CM_ORG, CM_REPO, ...) beats the file.
schema: concertmaster.config/v1

project:
  name: Acme                       # [script] digest title, report headers
  id: acme                         # [script] this project's id: stamped on the ledger as `project`; a ledger
                                   # of another project (a CM_HOME leaked from a second project's session on
                                   # a shared host) is refused, never read (scripts/ledger-guard.sh). Unset: no check
  owner:
    name: Alex                     # [script] the human the concertmaster reports to
    id: alex                       # [script] bead assignee / plan owner for "needs the owner"

# Where state lives on the concertmaster host. [script]
# Ledger, roster, briefs, handovers, outbox, salvage, intake files.
state_dir: ~/.concertmaster

github:
  org: AcmeOrg                     # [script] hygiene covers every repo in this org
  main_repo: acme-app              # [script] lanes and the merge gate run here
  exclude_repo_patterns:           # [script] shell globs, never in scope at all
    - "mirror-*"
  repos_on_request:                # other org repos: only when the owner hands work
    - acme-web
  # Repos that share the hosts but belong to nobody here: never read, nudge,
  # or tear down. Informational; the org filter already excludes them.
  out_of_scope_examples: [dotfiles, personal-tools]

worktrees:
  orca_repo: acme-app              # `orca worktree create --repo name:<this>`
  path_match: "/acme-app/"         # [script] ERE on worktree paths (abrupt.sh, waiting.sh)
  self_name: concertmaster         # [script] the concertmaster's own worktree, never torn down
  # Optional pin for the fleet state line (scripts/fleet-state.sh): the Orca host name (`local` or the environment
  # name) and the exact path of the concertmaster worktree. Set both once it runs somewhere fixed: a same-named copy
  # elsewhere is then not heard, and the gate blocks while that host cannot be read. Unset = any host answers
  # (ambiguity still blocks). self_path needs self_host. Env CM_SELF_HOST / CM_SELF_PATH win.
  # self_host: local
  # self_path: /srv/work/acme-app/concertmaster
  regenerable_ignored: []          # [script] ignored files teardown may drop (e.g. deno.lock)
  never_touch: []                  # worktrees or sessions of other projects on shared hosts: lanes never read or act on them

# The shared fleet state line `cm:state freeze=<on|off> window=<UTC> prod=<ver> at=<UTC>` in the concertmaster's own
# worktree comment (scripts/fleet-state.sh, SKILL.md § The tick step 4). [script]
fleet_state:
  # A line older than this is stale: leads act as freeze=on. Default: 2 ticks of the slowest schedule.tick_delays_s
  # value, never under 30 minutes (60 with the quiet delay of 1800 s). Env CM_STATE_STALE_MIN wins.
  stale_minutes: null
  # `fleet-state.sh write --freeze on --push` sends one terminal message to every lane whose worktree name matches this
  # regex (and has a Claude terminal). Freeze-off needs no push, leads read the line. Env CM_FREEZE_PUSH_MATCH wins.
  push_match: "-sweeper"

# scripts/pane-stalls.sh: panes that sit on a permission prompt (a subagent prompt shows in no worktree comment). [script]
stalls:
  regex: "Do you want to proceed"  # extended regex judged on each pane's last 25 non-empty lines; env CM_STALL_REGEX wins

# scripts/skill-sync.sh (SKILL.md § The tick step 1): how a merged change to the skill reaches the LIVE concertmaster
# checkout. It fast-forwards that worktree when the remote branch moved the skill directory, and never forces. [script]
# Each key is optional; a flag or the env var (CM_SKILL_SYNC_REPO, _PATH, _REMOTE, _BRANCH) wins over this block.
skill_sync:
  repo: null                       # the git worktree to keep current; default: the worktree holding the scripts
  path: null                       # the skill directory inside that repo, relative (e.g. ".agents/skills/concertmaster"); default: where the scripts sit
  remote: origin
  branch: main

# The daily lessons loop (scripts/lessons-recon.sh, SKILL.md § The tick step 4, references/lanes.md Lead charter 5b). [script]
lessons:
  per_lane_per_day: 3              # lessons counted per lane per UTC day; the rest are reported as capped
  min_lessons: 2                   # a gap qualifies with this many lessons, or with ONE that names a root cause and carries [failure]
  max_changes: 5                   # PR size cap: qualifying gaps beyond it wait for the next run
  carry_days: 7                    # a single lesson waits this long for its second before it ages out of the window
  blocker_min_runs: 8              # a cm:blocked item seen on this many asks.sh runs counts as a signal
  # Gaps that touch these force an owner ping. `file` or `file#section words`, relative to the skill directory.
  risk_paths: ["SKILL.md#hard rules", "SKILL.md#merge gate", "scripts/teardown.sh"]
  # Project-owned files (a toolkit sync overwrites references/, so the real log and blocklist live outside it).
  # Relative to the skill directory unless absolute. Start from references/lessons-log.md and
  # references/lessons-rejected.md; a missing file is an empty list.
  log_file: local/lessons-log.md
  rejected_file: local/lessons-rejected.md

# Ownership accounting [script]: scripts/classify.sh gives every in-scope worktree one owner lane
# and flags ORPHAN (nobody owns it) and LEAD-DEAD (a lane lead's session is gone while it still
# owns open work). Needs worktrees.orca_repo, worktrees.self_name and worktrees.never_touch above.
# Without this block, or with a malformed one, ownership is skipped and reported as off.
ownership:
  # lane lead worktree name -> lane label. Their comments are read for worker lists.
  leads:
    pr-sweeper: pr-sweeper
    dev-sweeper: dev-sweeper
    ops-sweeper: ops-sweeper
    research-sweeper: research-sweeper
  # Words that introduce a worker list in a lead's comment (case-insensitive). A marker counts
  # only when written as a header: followed by "(", "[" or ":" or by a few words and a colon.
  # A list runs to the next " | ", the next stop word followed by a colon, the next ALL-CAPS
  # header, the end of the sentence, or the end. Parenthesised text is ignored. Write lists
  # with commas, never pipes. A marker after not, never, no longer or dis is a negation.
  # "cm:child" is a different shape: each "cm:child <name> (description)" line (the form the lane
  # charter tells leads to post) claims one worker, the first token after the tag; the rest of the
  # line never names another worker. Drop it from this list to stop reading those lines as claims.
  comment_markers: ["workers i own", "workers owned", "my workers", "workers", "owned", "orchestrated", "cm:child"]
  comment_stop_words: ["sweep done", "merged today", "open ready", "held", "needs cm", "stuck check", "hosts read", "next check", "next tick", "next", "note", "cm"]
  # Optional. Session scratch dirs embed the worker's worktree name; a git-only worktree made
  # there inherits that worker's owner. The regex needs a named group "worker".
  # scratch_path_regex: "-workspaces-acme-app-(?<worker>[^/]+)/"
  # worktree-name prefix -> lane label (longest prefix wins). Add one when a family of worktrees
  # keeps showing up as ORPHAN.
  prefixes:
    task-: dev-sweeper
    incident-: ops-sweeper
    study-: research-sweeper
    pr-: pr-sweeper

# The census (scripts/discover.sh, scripts/classify.sh --census). [script]
census:
  # Untracked paths that never make a worktree dirty: tool scratch every lane writes. A tracked
  # change or an untracked source file is still dirt. A pattern starting with "/" is anchored at
  # the repo root (a "*" never crosses a "/"), so "/.orca/" does not hide src/.orca/x.ts; one
  # ending in "/" is a directory prefix anywhere; one holding "/" matches the whole path (or its
  # tail); any other matches the file name. Absent: this default list (tool scratch plus the bd
  # runtime files a running bd writes; "/.beads/*.jsonl" also covers .auto-import-issues.jsonl).
  # [] ignores nothing. Env CM_IGNORE_UNTRACKED (space separated) wins.
  ignore_untracked: ["/.beads/*.jsonl", "/.beads/dolt.gate.lock", "/.beads/embeddeddolt/", "/.beads/embeddeddolt.gate.lock", "/.beads/backup.lock", "/.beads/backup/", "/.beads.gate.lock", "/.agents/scratch/", "/.orca/", "/.wrangler/", "*.log"]

hosts:
  home: local                      # host the concertmaster runs on
  min_free_disk_gb: 8              # under this, spawn nothing on that host
  # Rediscovered every tick with `orca host list`; these are defaults the
  # ledger copies into hosts.<name> on first sight. role: general | native | overflow
  defaults: { role: general, maxWorkers: 4 }
  per_host:
    local: { role: general, maxWorkers: 6 }
    # build-mac: { role: native, maxWorkers: 2, hostname: build-mac }
    # hostname = what `hostname -s` prints on that host (case is ignored, a FQDN is cut to its short name).
    # Set it for every remote host: teardown.sh runs `hostname -s` over ssh and refuses ("ssh target is not
    # host <h>") when the answer differs from this key; with no key the host's own name (the Orca
    # environment name) is expected, which a host whose real name differs never matches. An ssh alias that
    # differs from the host name is given per run in CM_SSH_TARGET.

# Agent types the project does not allow. Each census (discover.sh, classify.sh) lists every
# terminal under worktrees.path_match whose Orca agentIdentity is one of these as a
# violation, and says CHECK INCOMPLETE (never "none") when a host could not be read.
# Empty (the default) turns the census off. Example: [codex]
agents:
  forbidden: []                    # [script] lowercase Orca agentIdentity values; CM_FORBIDDEN_AGENTS overrides

schedule:
  timezone: Europe/London          # [script] digest times and deploy windows use this zone
  timezone_label: UK               # [script] printed after times in the digest
  deploy_windows: ["11:00", "16:00"]
  digest_times: ["08:00", "18:00"]
  tick_delays_s: { busy: 600, running: 1200, quiet: 1800 }
  stuck_minutes: 45                # CM_STUCK_MIN
  stuck_respawn_hours: 2
  max_nudges: 2
  lane_loop_minutes: 30            # [script] default /loop interval of a standing lane; stale = no Claude turn for 2 x this (scripts/runtime-check.sh)

deploy:
  # How a window ships. The deploy worker follows ship_verb; the order is
  # fixed: merge, staging deploy, staging validate, only then production.
  ship_verb: .agents/skills/pr-sweep/verbs/ship.md
  production_tag_glob: "v*"        # delta = <last tag>..origin/main
  # Rails: any hit means ASK the owner, the window waits.
  rails:
    - name: destructive-migration
      paths: ["db/migrations/**"]
      content_patterns: ["DROP", "DELETE", "TRUNCATE"]
    - name: native-release
      paths: ["ios/**", "android/**"]
    - name: secrets-auth
      paths: [".github/workflows/deploy-*.yml"]
      note: "secret lines in deploy workflows, payments, auth flows"

queue:                             # scripts/queue.sh (references/queue.md)
  cap: 12                          # [script] total live agent sessions across hosts; no cap means nothing is granted
  grant_hold_minutes: 30           # [script] a fresh grant counts as live on its host for this long

merge:
  # GitHub logins whose `in-session review:` comment satisfies the review gate (the fleet's own account).
  in_session_review_authors: [acme-fleet-bot]
  # The pr-sweeper is the only merger. {pr} {org} {repo} are filled at run time.
  command: "gh pr merge {pr} -R {org}/{repo} --merge"
  env_prefix: ""                   # e.g. a hook bypass variable, if your merge hook needs one
  strategy: merge                  # merge | squash | rebase
  gates:
    evidence: "node scripts/ci/evidence.mjs --pr {pr} --json"   # must report ready_value
    ready_value: MERGE_READY
    review_verdict: ".agents/skills/pr-sweep/scripts/verdict-at-head.sh {pr}"
    ci_gate: "gh pr checks {pr} --required"
    verify_merged: ".agents/skills/pr-sweep/scripts/verify-merge.sh {pr}"
  review_round_cap: 3
  approved_only_classes: [auth, payments]

# Evidence for owner-facing proof (screenshots, recordings, logs). The engine never hosts files itself.
evidence:
  # Command that publishes one local file and prints a shareable URL. {file} is filled at run time.
  # Empty = no publisher: a worker attaches the file to the PR through the GitHub UI or API and says so.
  # Project rules (which states to capture, which accounts, which viewport) live in references/overlay.md.
  publish_cmd: ""                  # e.g. "scripts/evidence/publish {file}"

beads:
  ops_epic: acme-ops               # [script] intake parent for ops beads
  dev_epic: acme-dev               # [script] intake parent for feature and bug beads

# Lanes. standing: true lanes are never torn down. agent: claude | codex | agy.
lanes:
  # model: every Claude lane and the workers it spawns run claude-sonnet-5-5 at effort high.
  # loop_minutes (optional, any lane): that lane's /loop interval when it differs from schedule.lane_loop_minutes
  - { name: pr-sweeper,  standing: true,  spawn_at: 1, agent: claude, model: claude-sonnet-5-5, skills: [pr-sweep, ready-to-ship] }
  - { name: dev-sweeper, standing: true,  spawn_at: 2, agent: claude, model: claude-sonnet-5-5, skills: [dev-flow, ready-to-ship], max_parallel: 3 }
  - { name: ops-sweeper, standing: true,  spawn_at: 2, agent: claude, model: claude-sonnet-5-5, skills: [] }
  - { name: research-sweeper, standing: true, spawn_at: 0, agent: claude, model: claude-sonnet-5-5, skills: [research], publish: null }
    # spawn_at 0 = spawned at first boot and takes every item. publish: skill or command that
    # publishes owner-facing pages; null = the inbox file only
  # - { name: release-tester, standing: true, spawn_at: 0, agent: claude, model: claude-sonnet-5-5, skills: [] }
  #   uncomment to get a read-only production test after every release; fill release_tester below
  - { name: "epic:<name>", standing: true, spawn_at: 1, agent: claude, model: claude-sonnet-5-5, max_parallel: 3 }
single_task_workers: [deploy, ops-fix, sweep, native-release, one-pr]

# Per-lane journal ($CM_HOME/lanes/<lane>/journal.md, scripts/lane-journal.sh). Not under `lanes:`, which is the list above.
journal:
  tail_lines: 20                   # [script] entries `tail` prints without a count
  max_chars: 1500                  # [script] longest entry text
  keep_lines: 500                  # [script] `rotate` keeps the last N entries per lane
  keep_days: 90                    # [script] `rotate` drops entries older than this

# scripts/spawn-verify.sh: what a freshly started Claude pane must show before a brief is sent. [script]
# Display forms, as the pane prints them: the banner reads "<Model> <ver> with <effort> effort",
# the status line "<model>-<ver> · eff <effort>". --model and --effort on the command line win.
# Leave empty and `spawn-verify.sh check` exits 2 unless both flags are given.
spawn:
  expected_model: sonnet-5.5       # the model your spawn command pins, in display form (dot in the version)
  expected_effort: high            # the effort level your spawn command pins

ops:
  # Skills the ops-sweeper routes to. Leave empty and it investigates itself.
  route:
    data_repair: null              # e.g. a runbook skill for account/data repair
    user_cannot: null              # e.g. an incident-investigate skill
    errors: null                   # e.g. an error-tracker query skill
    bug_batch: null                # e.g. a triage-bugs skill for a chat batch
  production_data: read-only via runbooks; writes ASK

messaging:
  owner_digest:
    adapter: wacli                 # wacli | slack | email | none
    to: self                       # recipient handle for the adapter; "self" = the owner's own linked account
    send: "wacli send text --to {to} --allow-self --message {text}"
  collaborators:                   # non-owner PR authors the pr-sweeper may push to
    - { name: Sam, github: sam-dev, pr_comments: true, daily_dm: null }

# What may leave the concertmaster without a human OK.
outward_messages:
  owner_digest: autonomous
  collaborator_pr_comments: autonomous
  everything_else: draft_first     # shown to the owner as a draft, sent only after OK

# Follow-ups that outlive a worker (scripts/followups.sh escalate): an open one older than the limit, or one
# whose owner lane differs from the lane that posted it, becomes ONE issue in github.main_repo.
followups:
  escalate_after_hours: 24         # [script] age at which an open follow-up gets an issue
  issue_labels: []                 # [script] labels put on those issues; none by default

intake:
  adapter: wacli                   # the chat source; another adapter writes a wacli-shaped export
  source_label: chat               # [script] word used for the chat in trackers and bead bodies
  issue_repo: null                 # [script] default github.org/github.main_repo
  chats: {}                        # [script] alias: { jid: "<id>@g.us", title: "<group title>" }
  media:
    # Reporter media stays local: it is never uploaded to any host. A bead carries a local
    # path or a description in words.
    privacy_note: "the chat may carry personal data"   # [script] what the chat may carry; read before looking at media

telemetry:                         # optional mission-control style sink
  # base_url and tenant_id are REQUIRED for anything to be sent; there is no built-in default
  # for either. With either empty, scripts/mc-emit.sh queues events in outbox.jsonl (capped at
  # 5000 lines, drops logged in outbox.dropped) and sends nothing. Env MC_BASE_URL and
  # MC_TENANT_ID, or the same two lines in $CM_HOME/mc.env, beat these keys.
  base_url: ""                     # [script] e.g. https://mc.example.com
  tenant_id: ""                    # [script] the sink's id for this project, e.g. acme
  # Set when the token is project-bound (it may call only /api/events and must name one of its
  # projects on every event). Every event then carries projectId and fleet upserts are not sent.
  # Must match ^p_[a-z0-9][a-z0-9-]{0,38}$; empty or invalid sends no projectId. Env
  # MC_PROJECT_ID, or a MC_PROJECT_ID= line in $CM_HOME/mc.env, beats this key.
  project_id: ""                   # [script] e.g. p_example
  token_file: ~/.secrets/mc-auth-token   # [script] file holding the token, mode 600

# A session that waited this long on a human for a decision inside its own scope stops waiting
# (SKILL.md hard rule 16). Never covers merges, deploys, secrets, data or releases.
away:
  timeout_minutes: 30              # [script] scripts/ask-timeout.sh (references/away-timeout.md)
  own_scope_kinds: [code, design, test, scope, product]   # [script] ask kinds a verdict may cover
  repo: null                       # [script] where verdict comments live; default github.org/github.main_repo
  verdict_by: verdict-agent        # [script] decidedBy written when a verdict is recorded
  deny_extra: []                   # [script] regex fragments added to the owner-only subject scan, e.g. ["warehouse"]
  allow_paths: []                  # [script] regex fragments; non-empty replaces the default allowlist (src/ tests e2e docs public root *.md)
  never_paths: []                  # [script] regex fragments added to the never-list of changed paths

# Read-only production test after each release (lane release-tester in references/lanes.md).
# Only used when the lane is listed under lanes. Holds names and routes, never a credential.
release_tester:
  prod_url: https://app.example.com            # the production base URL the tester opens
  staging_note: "staging is https://staging.example.com"   # where a check that needs a write runs instead
  accounts: ["demo-reviewer-1", "demo-reviewer-2"]          # read-only demo accounts; credentials come from your secret store
  coverage: ["home and its tabs", "settings", "notifications"]   # routes and tabs every run covers
  viewports: [390, 1440]
  themes: [light, dark]
  evidence_branch: "evidence/release-{version}"   # signed evidence commits land here
  report_via: null                 # skill or command that publishes the report page; null = matrix in the comment plus issues only
  defect_label: release-regression

# scripts/ci-queue-alert.sh: alert when too many workflow runs stay queued. [script]
ci:
  queue:
    repo: null                     # default github.org/github.main_repo
    threshold: 15                  # more queued runs than this ...
    minutes: 15                    # ... for this long raises one alert per episode
    hint: "Check the runner fleet; adding runner capacity or flipping to GitHub-hosted runners is the concertmaster call."

# Nightly off-host copy of $CM_HOME to a peer host (scripts/backup-offhost.sh). Copies only
# ledger.json, ledger.bak/ and handovers/, and only after scripts/scan-secrets.sh finds nothing in
# that exact set; mc.env, salvage/, *.env, secrets, tmp.* and outbox* never leave the host.
backup:
  host: ""                         # [script] REQUIRED, no default: the owner chooses the target host (ssh alias, BatchMode, a host other than this one). Unset: the script exits 2
  remote_dir: backups/concertmaster   # [script] directory on the peer, relative to its home
  keep: 7                          # [script] dated generations kept on the peer
  max_age_hours: 50                # [script] scripts/backup-stale.sh alerts when no backup finished for this long (default 50 h: one missed night is quiet, two alert)

# scripts/cred-check.sh: weekly validity probe of the credentials in a names-only index. [script]
credentials:
  index_key: CONCERTMASTER-CREDENTIALS-INDEX   # name of the Bitwarden secret holding the index (names only)
  bws_project: null                # Bitwarden project the index secret lives in (needed only for --publish)
  transcript_dirs: []              # scripts/scan-secrets.sh default scan dirs (a list; empty = ~/.claude/projects) [script]

# scripts/unlinked-prs.sh: flag open PRs with no linked issue, one gh call per run. [script]
unlinked_prs:
  repo: null                       # default github.org/github.main_repo
  since: "2026-01-01T00:00:00Z"    # only PRs created at or after this are checked; set to your adoption date
  skip_authors: [dependabot, app/dependabot, renovate, app/renovate, github-actions]
  include_drafts: false
  timeout_s: 60

# scripts/automations-audit.sh: audit Orca automations that match the project or a lane. [script]
automations:
  names: []                        # extra name fragments to match besides project.name and the lane names
  expected: []                     # exact names of deliberate automations: never flagged DUPLICATE
  forbidden_agents: []             # an enabled automation running one of these is flagged FORBIDDEN, e.g. [codex]
  duplicate_pattern: "sweeper|lead|recovery|resume"   # regex on the name: a lane-recovery timer

terminology:
  rules: []                        # e.g. { use: Member, never: User, scope: user-facing copy }
  no_em_dashes: true

# Values still undecided. The SKILL's "Open config" table mirrors this list.
open_questions: []
