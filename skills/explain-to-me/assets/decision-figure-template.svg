<!-- Decision figure skeleton. Geometry is the hard part; the numbers are yours.
     REPLACE EVERY UPPERCASE SLOT with a real measured value and state the date
     measured. A figure with invented numbers is worse than no figure at all.
     Colour carries meaning, never variety:
       #B85C3E / #D97757  the failing side, or the zero that matters
       #788C5D            the healthy side
       #87867F            context
     Drop the whole figure rather than ship it half-filled. -->
<svg viewBox="0 0 860 340" role="img"
     aria-label="ONE SENTENCE DESCRIBING THE FINDING, FOR SCREEN READERS">

  <!-- left option -->
  <rect x="34" y="34" width="300" height="86" rx="10" fill="#FDF6F2" stroke="#D97757" stroke-width="2"/>
  <text x="184" y="66"  text-anchor="middle" font-family="ui-serif,Georgia,serif" font-size="17" fill="#141413">LEFT NAME</text>
  <text x="184" y="88"  text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#3D3D3A">LEFT MECHANISM</text>
  <text x="184" y="106" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#87867F">LEFT STORE</text>

  <!-- right option -->
  <rect x="526" y="34" width="300" height="86" rx="10" fill="#F4F7EF" stroke="#788C5D" stroke-width="2"/>
  <text x="676" y="66"  text-anchor="middle" font-family="ui-serif,Georgia,serif" font-size="17" fill="#141413">RIGHT NAME</text>
  <text x="676" y="88"  text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#3D3D3A">RIGHT MECHANISM</text>
  <text x="676" y="106" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#87867F">RIGHT STORE</text>

  <!-- the broken relationship between them -->
  <line x1="340" y1="77" x2="404" y2="77" stroke="#D1CFC5" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="456" y1="77" x2="520" y2="77" stroke="#D1CFC5" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="430" cy="77" r="19" fill="#fff" stroke="#B85C3E" stroke-width="2"/>
  <path d="M422 69 L438 85 M438 69 L422 85" stroke="#B85C3E" stroke-width="2.5" stroke-linecap="round"/>
  <text x="430" y="34"  text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#B85C3E" letter-spacing="0.08em">RELATIONSHIP</text>
  <text x="430" y="118" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#87867F">EVIDENCE LINE 1</text>
  <text x="430" y="132" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#87867F">EVIDENCE LINE 2</text>

  <!-- connectors down to the measurements -->
  <line x1="184" y1="120" x2="184" y2="160" stroke="#D1CFC5" stroke-width="2"/>
  <path d="M179 154 L184 162 L189 154 Z" fill="#D1CFC5"/>
  <line x1="676" y1="120" x2="676" y2="160" stroke="#D1CFC5" stroke-width="2"/>
  <path d="M671 154 L676 162 L681 154 Z" fill="#D1CFC5"/>

  <!-- measurements: the number that matters gets the clay, the rest stays grey -->
  <rect x="34" y="166" width="300" height="88" rx="8" fill="#FAF9F5" stroke="#E3DACC" stroke-width="1.5"/>
  <text x="50" y="190" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#3D3D3A">LEFT BASELINE</text>
  <text x="50" y="212" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#9C4A2E">LEFT KEY NUMBER</text>
  <text x="50" y="232" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#87867F">LEFT CAVEAT</text>

  <rect x="526" y="166" width="300" height="88" rx="8" fill="#FAF9F5" stroke="#E3DACC" stroke-width="1.5"/>
  <text x="542" y="190" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#3D3D3A">RIGHT BASELINE</text>
  <text x="542" y="212" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#9C4A2E">RIGHT KEY NUMBER</text>
  <text x="542" y="232" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#87867F">RIGHT CAVEAT</text>

  <!-- the cost of not deciding, with a number in it -->
  <rect x="34" y="272" width="792" height="48" rx="8" fill="#F7EAE3" stroke="#E8C9BA" stroke-width="1.5"/>
  <text x="430" y="293" text-anchor="middle" font-family="ui-serif,Georgia,serif" font-size="15" fill="#141413">THE SENTENCE THAT FORCES THE DECISION</text>
  <text x="430" y="311" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#9C4A2E">THE SUPPORTING NUMBERS, MEASURED, WITH THE DATE</text>
</svg>
