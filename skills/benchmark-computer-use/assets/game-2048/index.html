<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 Benchmark Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #faf8ef; color: #776e65; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .header { width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  h1 { font-size: 54px; font-weight: 800; color: #776e65; }
  .scores { display: flex; gap: 8px; }
  .score-box { background: #bbada0; color: #fff; padding: 8px 16px; border-radius: 6px; text-align: center; min-width: 75px; }
  .score-label { font-size: 11px; text-transform: uppercase; font-weight: 700; opacity: 0.8; }
  .score-val { font-size: 22px; font-weight: 800; }
  .sub-header { width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .controls-bar { display: flex; gap: 10px; }
  button.action-btn { background: #8f7a66; color: #f9f6f2; border: none; border-radius: 4px; padding: 10px 18px; font-weight: 700; font-size: 15px; cursor: pointer; transition: background 0.15s; }
  button.action-btn:hover { background: #9f8b77; }
  button.action-btn:active { background: #7f6a56; }
  .grid-container { width: 420px; height: 420px; background: #bbada0; border-radius: 8px; padding: 12px; position: relative; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 12px; }
  .grid-cell { background: rgba(238, 228, 218, 0.35); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; color: #776e65; transition: all 0.1s ease-in-out; }
  .tile-2 { background: #eee4da; color: #776e65; }
  .tile-4 { background: #ede0c8; color: #776e65; }
  .tile-8 { background: #f2b179; color: #f9f6f2; }
  .tile-16 { background: #f59563; color: #f9f6f2; }
  .tile-32 { background: #f67c5f; color: #f9f6f2; }
  .tile-64 { background: #f65e3b; color: #f9f6f2; }
  .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 28px; }
  .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }
  .tile-512 { background: #edc850; color: #f9f6f2; font-size: 28px; }
  .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 22px; }
  .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 22px; }
  .keypad { margin-top: 20px; display: grid; grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(2, 50px); gap: 10px; justify-content: center; }
  .keypad button { background: #dcd0c4; border: 2px solid #bbada0; border-radius: 8px; font-size: 18px; font-weight: bold; color: #776e65; cursor: pointer; }
  .keypad button:hover { background: #cfc2b5; }
  .keypad button:active { background: #8f7a66; color: #fff; }
  #btn-up { grid-column: 2; grid-row: 1; }
  #btn-left { grid-column: 1; grid-row: 2; }
  #btn-down { grid-column: 2; grid-row: 2; }
  #btn-right { grid-column: 3; grid-row: 2; }
  .status-message { margin-top: 15px; font-weight: bold; font-size: 16px; min-height: 24px; color: #8f7a66; }
</style>
</head>
<body>

<div class="header">
  <h1>2048</h1>
  <div class="scores">
    <div class="score-box">
      <div class="score-label">Score</div>
      <div class="score-val" id="score">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">Moves</div>
      <div class="score-val" id="moves">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">Best Tile</div>
      <div class="score-val" id="best-tile">0</div>
    </div>
  </div>
</div>

<div class="sub-header">
  <p>Join tiles, reach <strong>2048!</strong></p>
  <div class="controls-bar">
    <button class="action-btn" id="btn-restart" aria-label="New Game">New Game</button>
  </div>
</div>

<div class="grid-container" id="grid">
  <!-- 16 cells -->
  <div class="grid-cell" id="c-0-0" aria-label="cell 0 0"></div>
  <div class="grid-cell" id="c-0-1" aria-label="cell 0 1"></div>
  <div class="grid-cell" id="c-0-2" aria-label="cell 0 2"></div>
  <div class="grid-cell" id="c-0-3" aria-label="cell 0 3"></div>
  <div class="grid-cell" id="c-1-0" aria-label="cell 1 0"></div>
  <div class="grid-cell" id="c-1-1" aria-label="cell 1 1"></div>
  <div class="grid-cell" id="c-1-2" aria-label="cell 1 2"></div>
  <div class="grid-cell" id="c-1-3" aria-label="cell 1 3"></div>
  <div class="grid-cell" id="c-2-0" aria-label="cell 2 0"></div>
  <div class="grid-cell" id="c-2-1" aria-label="cell 2 1"></div>
  <div class="grid-cell" id="c-2-2" aria-label="cell 2 2"></div>
  <div class="grid-cell" id="c-2-3" aria-label="cell 2 3"></div>
  <div class="grid-cell" id="c-3-0" aria-label="cell 3 0"></div>
  <div class="grid-cell" id="c-3-1" aria-label="cell 3 1"></div>
  <div class="grid-cell" id="c-3-2" aria-label="cell 3 2"></div>
  <div class="grid-cell" id="c-3-3" aria-label="cell 3 3"></div>
</div>

<div class="keypad">
  <button id="btn-up" aria-label="Move Up">↑</button>
  <button id="btn-left" aria-label="Move Left">←</button>
  <button id="btn-down" aria-label="Move Down">↓</button>
  <button id="btn-right" aria-label="Move Right">→</button>
</div>

<div class="status-message" id="status" aria-live="polite">Ready</div>

<script>
  let board = Array(4).fill(null).map(() => Array(4).fill(0));
  let score = 0;
  let moves = 0;

  function initGame() {
    board = Array(4).fill(null).map(() => Array(4).fill(0));
    score = 0;
    moves = 0;
    addRandomTile();
    addRandomTile();
    updateUI();
    document.getElementById('status').innerText = 'Game started';
  }

  function addRandomTile() {
    const emptyCells = [];
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (board[r][c] === 0) emptyCells.push({ r, c });
      }
    }
    if (emptyCells.length > 0) {
      const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
    }
  }

  function updateUI() {
    let maxTile = 0;
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const val = board[r][c];
        const cell = document.getElementById(`c-${r}-${c}`);
        cell.innerText = val > 0 ? val : '';
        cell.className = 'grid-cell' + (val > 0 ? ` tile-${val}` : '');
        cell.setAttribute('aria-label', `row ${r+1} col ${c+1}: ${val > 0 ? val : 'empty'}`);
        if (val > maxTile) maxTile = val;
      }
    }
    document.getElementById('score').innerText = score;
    document.getElementById('moves').innerText = moves;
    document.getElementById('best-tile').innerText = maxTile;
  }

  function slide(row) {
    let arr = row.filter(val => val !== 0);
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        score += arr[i];
        arr[i + 1] = 0;
      }
    }
    arr = arr.filter(val => val !== 0);
    while (arr.length < 4) arr.push(0);
    return arr;
  }

  function moveLeft() {
    let moved = false;
    for (let r = 0; r < 4; r++) {
      const original = [...board[r]];
      const next = slide(board[r]);
      if (JSON.stringify(original) !== JSON.stringify(next)) moved = true;
      board[r] = next;
    }
    return moved;
  }

  function rotateRight(mat) {
    const result = Array(4).fill(null).map(() => Array(4).fill(0));
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        result[c][3 - r] = mat[r][c];
      }
    }
    return result;
  }

  function move(direction) {
    let moved = false;
    if (direction === 'left') {
      moved = moveLeft();
    } else if (direction === 'right') {
      board = rotateRight(rotateRight(board));
      moved = moveLeft();
      board = rotateRight(rotateRight(board));
    } else if (direction === 'up') {
      board = rotateRight(rotateRight(rotateRight(board)));
      moved = moveLeft();
      board = rotateRight(board);
    } else if (direction === 'down') {
      board = rotateRight(board);
      moved = moveLeft();
      board = rotateRight(rotateRight(rotateRight(board)));
    }

    if (moved) {
      moves++;
      addRandomTile();
      updateUI();
      document.getElementById('status').innerText = `Moved ${direction}`;
      window.lastMove = direction;
    }
    return moved;
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); move('up'); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); move('down'); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); move('left'); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); move('right'); }
  });

  document.getElementById('btn-up').onclick = () => move('up');
  document.getElementById('btn-down').onclick = () => move('down');
  document.getElementById('btn-left').onclick = () => move('left');
  document.getElementById('btn-right').onclick = () => move('right');
  document.getElementById('btn-restart').onclick = () => initGame();

  initGame();
</script>
</body>
</html>
