# Codex CLI configuration
# See: https://developers.openai.com/codex/guides/agents-md/

# Treat these filenames as instruction sources when AGENTS.md isn't present.
project_doc_fallback_filenames = ["CLAUDE.md", "TEAM_GUIDE.md", ".agents.md"]

# Allow larger combined guidance before truncation.
project_doc_max_bytes = 65536
model = "gpt-5.6-terra"
model_reasoning_effort = "xhigh"
model_verbosity = "low"
model_reasoning_summary = "none"
hide_agent_reasoning = true
personality = "pragmatic"
approvals_reviewer = "user"
plan_mode_reasoning_effort = "high"

# Skip the startup version check so a session opens without an update nag.
check_for_update_on_startup = false

[tui]
raw_output_mode = false
animations = false
show_tooltips = false
status_line = ["model-with-reasoning", "reasoning", "project-name", "permissions", "approval-mode", "context-used", "five-hour-limit", "weekly-limit", "fast-mode"]
terminal_title = []
notifications = false
status_line_use_colors = true

[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true
hide_world_writable_warning = true
hide_gpt5_1_migration_prompt = true

[features]
memories = true
js_repl = false
remote_control = true

hooks = true
plugin_hooks = true
[desktop]
preventSleepWhileRunning = false
keepRemoteControlAwakeWhilePluggedIn = true
followUpQueueMode = "queue"
dock-icon-preference = "codex-system"
conversationDetailMode = "STEPS_COMMANDS"
realtimeVoiceScreenContextEnabled = true
